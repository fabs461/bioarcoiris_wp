<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Producto · Bio-Arcoiris</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="producto">

<header class="site-header">
  <div class="site-header__row">
    <a class="brand" href="index.html" aria-label="Ir a Bio-Arcoiris">
      <img src="favicon.svg" alt="" class="brand__logo">
      <div class="brand__text">
        <span class="brand__name">Bio-Arcoiris</span>
        <span class="brand__tagline">Tienda virtual</span>
      </div>
    </a>

    <span class="search-wrap search-wrap--placeholder"></span>

    <div class="auth-area">
      <a class="btn btn--outline btn--icon-square" href="index.html" aria-label="Volver al catálogo" title="Volver al catálogo">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span class="btn btn--outline btn--icon-square" aria-hidden="true" style="pointer-events:none;">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20.5s-7.8-4.8-7.8-10.3A4.7 4.7 0 0 1 12 7.3a4.7 4.7 0 0 1 7.8 2.9c0 5.5-7.8 10.3-7.8 10.3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="cart-badge" data-badge="wishlist" hidden>0</span>
      </span>
      <span class="btn btn--outline btn--icon-square" aria-hidden="true" style="pointer-events:none;">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 5h2l1.6 9.6a2 2 0 0 0 2 1.7h7.1a2 2 0 0 0 2-1.6L20 8H7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="19.5" r="1.3" fill="currentColor"/>
          <circle cx="17" cy="19.5" r="1.3" fill="currentColor"/>
        </svg>
        <span class="cart-badge" data-badge="cart" hidden>0</span>
      </span>
    </div>
  </div>
</header>

<div class="page" id="productPage">
  <p class="breadcrumb" id="breadcrumb"></p>

  <div id="productLoading" class="empty-state">Cargando producto…</div>
  <div id="productError" class="empty-state" hidden>No se pudo encontrar este producto. Puede que ya no esté disponible.</div>

  <section class="product-detail" id="productDetail" hidden>
    <div class="product-detail__media">
      <img id="detailImage" class="product-detail__image" alt="">
    </div>
    <div class="product-detail__info">
      <h1 class="product-detail__name" id="detailName"></h1>
      <p class="product-detail__code">Código de producto: <span id="detailCode"></span></p>
      <div class="product-detail__meta" id="detailMeta"></div>
      <span class="product-detail__price" id="detailPrice"></span>

      <div class="product-detail__actions">
        <button type="button" class="btn btn--outline btn--block" id="wishlistToggleBtn">Añadir a la lista de deseos</button>
        <button type="button" class="btn btn--ghost-dark btn--block" id="addCartBtn">Añadir al carrito</button>
        <button type="button" class="btn btn--primary btn--block" id="buyNowBtn">Comprar ahora</button>
      </div>

      <div class="product-detail__desc">
        <h2>Descripción</h2>
        <p id="detailDescription"></p>
      </div>
    </div>
  </section>

  <section class="recent-viewed" id="recentViewedSection" hidden>
    <h2 class="recent-viewed__title">Últimos productos visitados</h2>
    <div class="recent-viewed__grid" id="recentViewedGrid"></div>
  </section>
</div>

<footer class="site-footer">
  <p>© 2026 Bio-Arcoiris — tienda virtual.</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="common.js"></script>
<script src="product.js"></script>
</body>
</html>
